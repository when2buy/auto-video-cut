      return (this.data.rows||[]).filter(r=>{
        if (this.onlyDiffs) {
          const texts = (r.items||[]).map(i=>JSON.stringify(i.value));

        if (!f) return true;
        const hay = JSON.stringify(r).toLowerCase();
        return hay.includes(f);
      });
    }
  };
